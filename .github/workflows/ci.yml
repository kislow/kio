name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  # publish.yml runs the same checks on the release tag before publishing.
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels the run for the commit it replaced, so queued work
# gets the runners (#242). Edits (for the title check) have their own group and
# never cancel a code run. Main and publish's workflow_call key on the commit
# and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'edited' && 'edit' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The repository variable RUNNER picks the runner label; unset, jobs run on
# GitHub-hosted ubuntu-latest. The repository variable IMAGE_PREFIX names the
# registry repositories (<prefix>-kb, -mcp, -vault); unset, the prefix is kio.
# The images job says which registry they go to.
jobs:
  # PRs are squash-merged, so the PR title becomes the one commit on main that
  # release-please reads to choose the next version and write the changelog.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions: {}
    steps:
      - name: PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert|style)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "${TITLE}" =~ ${pattern} ]]; then
            echo "::error::PR title is not a Conventional Commit: ${TITLE}"
            exit 1
          fi

  # Scans the tree and every commit in the history (fetch-depth 0). The rules
  # and the allow-list are in .gitleaks.toml. The binary is the pinned release,
  # checked against its sha256 before it runs; keep the version in step with the
  # gitleaks rev in .pre-commit-config.yaml.
  gitleaks:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.24.2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
      - name: Scan for secrets
        run: gitleaks detect --redact --source . --config .gitleaks.toml

  go:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # go.mod and go.sum must be complete as committed; nothing is fixed up at build time.
      - run: go mod tidy -diff
      - run: go mod verify
      # -race needs cgo; the self-hosted image has no C toolchain, hosted runners do.
      - name: C toolchain for the race detector
        run: command -v gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc libc6-dev; }
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0   # keep in step with GOLANGCI_VERSION in the Makefile
          # Skip the schema download: it timed out on GitHub runners and failed the job.
          verify: false
      - run: go test -race -coverprofile=cover.out ./...
      - name: Coverage on the boundary packages
        run: go run ./internal/tools/covercheck -min 80 cover.out pkg/scope pkg/config pkg/projects internal/ki internal/server internal/pack internal/cli internal/vault internal/redact internal/standup
      - name: Validate projects.yaml
        run: go run ./cmd/ki validate deploy/config/projects.yaml
      - name: ki builds for every release target
        run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/ki
          done

  kb:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kb
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      # The image installs strictly from uv.lock (uv sync --frozen), and uv run
      # would quietly re-lock below and hide a dependency missing from it, which
      # is how 0.25.0 shipped without prometheus-client. pip check fails when an
      # installed package (ki-kb included) requires something the lock did not
      # install. The lock check catches a stale lock; the release workflow
      # re-locks ki-kb's own version on the release PR (release.yml), one push
      # after release-please's bump, so the bump commit itself would always fail
      # here; publish.yml checks the lock again at the tag.
      - run: uv lock --check
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
      - run: uv pip check
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - name: Validate projects.yaml
        run: uv run python -m ki_kb.projects ../deploy/config/projects.yaml
      - run: uv run pytest -q   # coverage gate: --cov-fail-under in pyproject.toml

  diagram:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: diagram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diagram/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node_modules/.bin/playwright-core install --with-deps chromium-headless-shell
      # The PDF test must run here, not skip for want of a browser.
      - run: npm test
        env:
          KI_DIAGRAM_REQUIRE_BROWSER: "1"

  # Fails on a dependency licence the project does not ship (GPL, AGPL, LGPL,
  # SSPL, BUSL, unknown or custom) unless .licence-allow.txt names it with a reason.
  licences:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/licences.sh

  deploy:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build manifests and check the sensitive boundary
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz | tar xz
          ./kustomize build deploy > built.yaml
          uv run --with pyyaml python deploy/check.py < built.yaml
          ./kustomize build examples/config > overlay.yaml
          uv run --with pyyaml python deploy/check.py < overlay.yaml

  # Every main build is pushed as sha-<sha> only: no moving :main tag, so a
  # registry can keep tags immutable. Releases are published by publish.yml;
  # the cluster only runs release tags.
  #
  # Where the images go is chosen by repository variables, not by the workflow:
  #   default                  ghcr.io/<owner>/<prefix>-kb and -mcp, with GITHUB_TOKEN
  #   AWS_ECR_ROLE_ARN set     optional: push to your own ECR instead, through
  #                            GitHub's OIDC token (AWS_REGION names the region)
  # The vault image is pushed only when PUBLISH_VAULT is "true". Its Dockerfile
  # installs a package whose licence forbids redistribution, so a public
  # repository leaves it unset and docs/vault.md has users build it themselves.
  # Provenance is attested only on a public repository, where GitHub offers it.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, kb, deploy]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include: ${{ fromJSON(vars.PUBLISH_VAULT == 'true' && '[{"component":"mcp","context":".","file":"cmd/ki-mcp/Dockerfile"},{"component":"kb","context":"kb","file":"kb/Dockerfile"},{"component":"vault","context":".","file":"vault/Dockerfile"}]' || '[{"component":"mcp","context":".","file":"cmd/ki-mcp/Dockerfile"},{"component":"kb","context":"kb","file":"kb/Dockerfile"}]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      # The registry layer cache needs a docker-container builder, not the default driver.
      - uses: docker/setup-buildx-action@v4.4.1
      - if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2.1.7
      - if: vars.AWS_ECR_ROLE_ARN == ''
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ vars.IMAGE_PREFIX || 'kio' }}-${{ matrix.component }}
        run: |
          set -euo pipefail
          registry="${ECR_REGISTRY:-ghcr.io/$(tr '[:upper:]' '[:lower:]' <<<"${OWNER}")}"
          echo "ref=${registry}/${IMAGE}" >> "${GITHUB_OUTPUT}"
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: VERSION=main-${{ github.sha }}
          tags: ${{ steps.image.outputs.ref }}:sha-${{ github.sha }}
          # The same layer cache publish.yml uses, so a release right after a
          # merge mostly reuses this build's layers. See publish.yml for the flags.
          cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: ${{ vars.AWS_ECR_ROLE_ARN == '' }}
