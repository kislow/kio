[project]
name = "ki-kb"
version = "0.2.0"
description = "kio knowledge base: Temporal ingest workers and the kb-query service, on Graphiti + FalkorDB"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "graphiti-core[falkordb]>=0.31,<0.32",
  "openai>=1.50",
  "pydantic>=2",
  "httpx>=0.27",
  "temporalio>=1.34,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "redis>=5",
  "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "fakeredis>=2.26",
]

[project.scripts]
ki-kb-worker = "ki_kb.worker:main"
ki-kb-query = "ki_kb.query:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ki_kb"]

[tool.pytest.ini_options]
testpaths = ["tests", "../scripts/publish"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=ki_kb --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.coverage.run]
# Process wiring only (Temporal worker start-up, uvicorn entry point); everything it calls is tested.
omit = ["src/ki_kb/worker.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle, pyflakes
  "I",             # import sorting
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplifications
  "S",             # bandit
  "T20",           # no print()
  "LOG", "G",      # logging misuse
  "PTH",           # pathlib
  "ANN",           # annotations required
  "BLE",           # blind except
  "TRY",           # exception handling style
  "ASYNC",         # async pitfalls
  "RUF",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN", "T20"]
"../scripts/publish/test_*.py" = ["S101"]
"src/ki_kb/query.py" = ["S104"]  # binds all interfaces inside the pod; NetworkPolicy limits callers

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["graphiti_core.*", "temporalio.*", "fakeredis.*", "falkordb.*"]
ignore_missing_imports = true
