[project]
name = "myproject"
version = "0.1.0"
description = "One line about what this does."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myproject"]

# uv: `uv sync`, `uv add <pkg>`, `uv run pytest`, `uv lock`

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle, pyflakes
  "I",             # import sorting (replaces isort)
  "B",             # bugbear: likely bugs
  "UP",            # pyupgrade
  "SIM",           # simplifications
  "S",             # bandit: security (hardcoded secrets, shell=True, ...)
  "T20",           # flake8-print: no print()
  "LOG", "G",      # logging misuse
  "PTH",           # pathlib
  "ANN",           # annotations required
  "BLE",           # blind except
  "TRY",           # exception handling style
  "ASYNC",         # async pitfalls
  "RUF",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "T20"]   # asserts and loose typing are fine in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=myproject --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
