apiVersion: v1
kind: Service
metadata:
  name: kb-query
  labels:
    app.kubernetes.io/name: kb-query # selected by the ServiceMonitor in monitoring.yaml
spec:
  selector:
    app.kubernetes.io/name: kb-query
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kb-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kb-query
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kb-query
          image: kio-kb
          # Pinned to a release tag (deploy/kustomization.yaml); release tags are never reused.
          imagePullPolicy: IfNotPresent
          command: ["ki-kb-query"]
          ports:
            - name: http
              containerPort: 8000
          # Model providers come from the namespace's kb-models ConfigMap.
          envFrom:
            - configMapRef:
                name: kb-models
          env:
            - name: KI_ALLOWED_GRAPHS
              value: cortex,brain-voice,brain-acme,brain-security,brain-client,brain-client-*
            - name: FALKORDB_HOST
              value: falkordb-0.falkordb.harness.svc.cluster.local
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef: { name: kb-secrets, key: falkordb-password }
            - name: KI_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: kb-secrets, key: llm-api-key, optional: true }
            - name: KI_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef: { name: kb-secrets, key: embedding-api-key, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
