apiVersion: v1
kind: Service
metadata:
  name: ki-mcp
  labels:
    app.kubernetes.io/name: ki-mcp # selected by the ServiceMonitor in kb/monitoring.yaml
spec:
  selector:
    app.kubernetes.io/name: ki-mcp
  ports:
    - name: http
      port: 8787
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ki-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ki-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ki-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        # distroless declares its user by name (nonroot); the kubelet can only
        # verify runAsNonRoot against a numeric uid.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ki-mcp
          image: kio-mcp
          # Pinned to a release tag (deploy/kustomization.yaml); release tags are never reused.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            # About 90% of the memory limit below, so the GC works to the limit instead of being OOM-killed.
            - { name: GOMEMLIMIT, value: 115MiB }
          volumeMounts:
            - name: config
              mountPath: /etc/ki
              readOnly: true
            - name: tokens
              mountPath: /etc/ki/tokens
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: ki-mcp-config
        - name: tokens
          secret:
            secretName: ki-mcp-tokens
