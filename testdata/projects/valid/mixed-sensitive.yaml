# A repo may feed a sensitive and a non-sensitive brain from different paths.
sensitive_brains: [client]
identities:
  personal: {github_user: alice, email: me@example.com, credential: personal, ingest: true}
  other: {github_user: other, email: o@example.com, credential: other, ingest: true}
projects:
  - {name: x, repo: https://github.com/a/b, identity: personal, brains: [client, acme], ingest: [{path: a/, brain: client}, {path: b/, brain: acme}]}
