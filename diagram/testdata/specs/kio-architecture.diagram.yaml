  - name: Ingest
    intro:
      title: How documents become knowledge
      about: Every 5 minutes Temporal starts a sync. kb-worker clones each project, keeps only changed Markdown, has Claude Haiku extract facts, embeds them in the cluster and writes them to the project's brain.
