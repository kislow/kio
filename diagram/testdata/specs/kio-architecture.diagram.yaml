  - name: Overview
    intro:
      title: kio at a glance
      about: Agents on your devices reach ki-mcp over your VPN, and it answers from the FalkorDB brains. kb-worker fills those brains from GitHub every 5 minutes; Argo CD deploys it all from a pinned release.
    outro:
      title: Explaining it in one minute
      body: "Every AI agent starts from zero: it does not know our conventions, past decisions or what is running. kio fixes that. Everything I write, repos, notes, reviews, decisions and incidents, is turned into knowledge graphs, one per project, called brains. When I start an agent with ki, it works out which project and identity I am in; before planning, the agent asks ki-mcp for a context pack with that project's conventions, decisions and current state, trimmed to a budget. Each machine's token limits which brains it may read, everything runs on my own cluster behind my VPN, and a new note from any device is ingested within about ten minutes.\n\nWalking someone through it: start on Why, then this page, then tell the story on One note, end to end. Keep the other pages for questions, and the Glossary for new words."
